version: 0.2

env:
  variables:
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_ACCOUNT_ID: "042469170563"
      VERSION: 2.0.0
      # Solo mueve el tag latest cuando la versión ya se validó en producción.
      TAG_LATEST: "false"
phases:
  pre_build:
    commands:
      - REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRY
  build:
    commands:
      - echo Build version $VERSION started on `date`
      - docker build -t mznotifier:$VERSION .
      - docker tag mznotifier:$VERSION $REGISTRY/mznotifier:$VERSION
      - if [ "$TAG_LATEST" = "true" ]; then docker tag mznotifier:$VERSION $REGISTRY/mznotifier:latest; fi
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $REGISTRY/mznotifier:$VERSION
      - if [ "$TAG_LATEST" = "true" ]; then docker push $REGISTRY/mznotifier:latest; fi
